run:
  timeout: 5m

linters:
  enable:
    - errcheck       # unhandled errors
    - gosimple       # simplification suggestions
    - govet          # suspicious constructs
    - ineffassign    # unused assignments
    - staticcheck    # broad static analysis
    - unused         # unused code
    - gofmt          # formatting
    - goimports      # import grouping / ordering
    - misspell       # typos in comments and strings
    - revive         # opinionated style (replaces golint)
    - gocritic       # additional checks
    - bodyclose      # http response body not closed
    - noctx          # http requests without context

linters-settings:
  goimports:
    local-prefixes: github.com/your-org
  revive:
    rules:
      - name: exported
        severity: warning

issues:
  exclude-rules:
    # Tests are allowed to ignore errors on helper calls.
    - path: _test\.go
      linters:
        - errcheck
